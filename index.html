<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<title>جرد الربيعي ماركت</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f1f5f1;margin:0;color:#222}
header{background:#14532d;color:white;padding:20px;text-align:center}
main{padding:15px;max-width:700px;margin:auto}
.card{background:white;padding:15px;border-radius:12px;margin:12px 0}
input,button{width:100%;padding:13px;margin:6px 0;border-radius:8px;font-size:16px}
input{border:1px solid #bbb}
button{border:0;background:#166534;color:white;font-weight:bold;cursor:pointer}
button.small{background:#475569}
button.secondary{background:#0f766e}
.item{border-bottom:1px solid #ddd;padding:12px}
.muted{color:#64748b;font-size:14px}
.good{color:#166534;font-weight:bold}
.bad{color:#b91c1c;font-weight:bold}
#reader{width:100%;margin-top:10px}
.result{background:#f8fafc;border:1px solid #cbd5e1;padding:12px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<header>
<h2>الربيعي ماركت</h2>
<p>نظام إدارة وجرد المخزون</p>
</header>
<main>
<div class="card">
<h3>إضافة صنف جديد</h3>
<input id="barcode" placeholder="رقم الباركود">
<button type="button" onclick="startScanner('add')">📷 مسح باركود لإضافة صنف</button>
<div id="reader"></div>
<button type="button" class="small" onclick="stopScanner()">إغلاق الكاميرا</button>
<input id="name" placeholder="اسم الصنف">
<input id="qty" type="number" min="0" step="any" placeholder="الكمية المسجلة">
<input id="price" type="number" min="0" step="any" placeholder="سعر الشراء">
<button onclick="addItem()">إضافة الصنف</button>
</div>

<div class="card">
<h3>الجرد الفعلي بالكاميرا</h3>
<p class="muted">امسح باركود الصنف، ثم أدخل الكمية التي وجدتها فعلياً في المستودع. لن تتغير كمية المخزون المسجلة.</p>
<button type="button" class="secondary" onclick="startScanner('count')">📷 مسح باركود للبحث والجرد</button>
<div id="countResult" class="result">لم يتم اختيار صنف بعد.</div>
<input id="actualQty" type="number" min="0" step="any" placeholder="أدخل الكمية الفعلية">
<button type="button" onclick="saveActualCount()">💾 حفظ الكمية الفعلية</button>
</div>

<div class="card">
<h3>إدارة بيانات المخزون</h3>
<button onclick="manualSave()">💾 حفظ البيانات الآن</button>
<button onclick="document.getElementById('excelFile').click()">📥 استيراد بيانات Excel</button>
<input type="file" id="excelFile" accept=".xlsx,.xls" hidden onchange="importExcel(event)">
<button onclick="exportExcel()">📤 تصدير المخزون ونتائج الجرد إلى Excel</button>
<button onclick="backupData()">💾 حفظ نسخة احتياطية</button>
<button onclick="document.getElementById('backupFile').click()">📂 استعادة نسخة احتياطية</button>
<input type="file" id="backupFile" accept=".json" hidden onchange="restoreBackup(event)">
<p>الحفظ التلقائي مفعل بعد كل عملية.</p>
<p id="lastSaved"></p>
</div>

<div class="card">
<h3>بحث عن صنف</h3>
<input id="search" placeholder="اكتب اسم الصنف أو الباركود" oninput="showItems()">
<h3>الأصناف المسجلة</h3>
<div id="items"></div>
</div>
</main>

<script src="./xlsx.full.min.js"></script>
<script src="./native.js"></script>
<script>
let stock = JSON.parse(localStorage.getItem('stock') || '[]');
let selectedCountIndex = -1;

function save(){
  localStorage.setItem('stock', JSON.stringify(stock));
  localStorage.setItem('stock_last_saved', new Date().toISOString());
  showItems();
  updateSavedTime();
}
function updateSavedTime(){
  const saved=localStorage.getItem('stock_last_saved');
  document.getElementById('lastSaved').textContent=saved?'آخر حفظ: '+new Date(saved).toLocaleString('ar'):'';
}
function manualSave(){save();alert('تم حفظ جميع بيانات المخزون بنجاح');}

function addItem(){
  const barcode=document.getElementById('barcode').value.trim();
  const name=document.getElementById('name').value.trim();
  const qty=Number(document.getElementById('qty').value);
  const price=Number(document.getElementById('price').value);
  if(!name){alert('أدخل اسم الصنف');return;}
  if(barcode && stock.some(x=>String(x.barcode||'')===barcode)){
    alert('هذا الباركود مسجل مسبقاً. ابحث عن الصنف بدلاً من إضافة نسخة مكررة.');
    return;
  }
  stock.push({barcode,name,qty:Number.isFinite(qty)?qty:0,price:Number.isFinite(price)?price:0});
  save();
  ['barcode','name','qty','price'].forEach(id=>document.getElementById(id).value='');
  alert('تمت إضافة الصنف');
}

function showItems(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const filtered=stock.filter(x=>
    String(x.name||'').toLowerCase().includes(q) ||
    String(x.barcode||'').toLowerCase().includes(q)
  );
  document.getElementById('items').innerHTML=filtered.map(x=>{
    const index=stock.indexOf(x);
    const hasActual=x.actualQty!==undefined && x.actualQty!==null && x.actualQty!=='';
    const diff=hasActual?Number(x.actualQty)-Number(x.qty||0):null;
    const diffLabel=!hasActual?'لم يتم الجرد':diff>0?'وفر: '+diff:diff<0?'عجز: '+Math.abs(diff):'متطابق';
    return `<div class="item">
      <b>${escapeHTML(x.name)}</b><br>
      الباركود: ${escapeHTML(x.barcode||'-')}<br>
      كمية النظام: ${Number(x.qty)||0}<br>
      سعر الشراء: ${Number(x.price)||0}<br>
      ${hasActual?`الكمية الفعلية: ${Number(x.actualQty)||0}<br>الفرق: <span>${diffLabel}</span><br><span class="muted">آخر جرد: ${escapeHTML(x.countedAt||'-')}</span><br>`:'لم يتم جرده بعد<br>'}
      <button class="small" onclick="selectItemForCount(${index})">تسجيل / تعديل الجرد</button>
      <button class="small" onclick="delItem(${index})">حذف</button>
    </div>`;
  }).join('') || '<p class="muted">لا توجد أصناف مطابقة.</p>';
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function delItem(i){
  if(confirm('هل تريد حذف الصنف؟')){stock.splice(i,1);if(selectedCountIndex===i)selectedCountIndex=-1;save();renderCountSelection();}
}
function selectItemForCount(i){
  selectedCountIndex=i;
  const item=stock[i];
  document.getElementById('actualQty').value=item.actualQty??'';
  renderCountSelection();
  document.getElementById('actualQty').focus();
}
function renderCountSelection(){
  const box=document.getElementById('countResult');
  if(selectedCountIndex<0 || !stock[selectedCountIndex]){
    box.textContent='لم يتم اختيار صنف بعد.';
    return;
  }
  const x=stock[selectedCountIndex];
  const actual=x.actualQty===undefined?'لم يسجل بعد':Number(x.actualQty);
  const diff=x.actualQty===undefined?'لم يتم الجرد':Number(x.actualQty)>Number(x.qty||0)?'وفر: '+(Number(x.actualQty)-Number(x.qty||0)):Number(x.actualQty)<Number(x.qty||0)?'عجز: '+(Number(x.qty||0)-Number(x.actualQty)):'متطابق';
  box.innerHTML=`<b>${escapeHTML(x.name)}</b><br>الباركود: ${escapeHTML(x.barcode||'-')}<br>كمية النظام: ${Number(x.qty)||0}<br>الكمية الفعلية المحفوظة: ${actual}<br>الفرق: ${diff}`;
}
function handleScannedBarcode(value){
  const code=String(value||'').trim();
  if(!code)return;
  const barcodeInput=document.getElementById('barcode');
  if(window.scannerPurpose==='count'){
    const index=stock.findIndex(x=>String(x.barcode||'').trim()===code);
    if(index<0){
      selectedCountIndex=-1;
      renderCountSelection();
      alert('لم يتم العثور على صنف بهذا الباركود: '+code);
      return;
    }
    selectItemForCount(index);
    document.getElementById('actualQty').focus();
  }else{
    barcodeInput.value=code;
    const existing=stock.findIndex(x=>String(x.barcode||'').trim()===code);
    if(existing>=0){
      alert('هذا الباركود مسجل للصنف: '+stock[existing].name+'، يمكنك جرده من قسم الجرد الفعلي.');
    }
  }
}
function saveActualCount(){
  if(selectedCountIndex<0 || !stock[selectedCountIndex]){
    alert('امسح باركود الصنف أو اختره من قائمة الأصناف أولاً.');
    return;
  }
  const raw=document.getElementById('actualQty').value.trim();
  if(raw==='' || !Number.isFinite(Number(raw)) || Number(raw)<0){
    alert('أدخل كمية فعلية صحيحة (صفر أو أكثر).');
    return;
  }
  stock[selectedCountIndex].actualQty=Number(raw);
  stock[selectedCountIndex].countedAt=new Date().toLocaleString('ar');
  save();
  renderCountSelection();
  alert('تم حفظ الكمية الفعلية دون تغيير كمية المخزون المسجلة.');
}

function toArabicWesternNumber(value){
  return String(value??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
function parseExcelNumber(value){
  if(value===null || value===undefined || String(value).trim()==='')return 0;
  const normalized=toArabicWesternNumber(value).replace(/[٬, ]/g,'').replace(/٫/g,'.');
  const number=Number(normalized);
  return Number.isFinite(number)?number:NaN;
}
function normalizeHeader(value){
  return String(value??'').replace(/^\uFEFF/,'').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,'').toLowerCase();
}
function findHeaderIndex(headers, aliases){
  const normalized=headers.map(normalizeHeader);
  return normalized.findIndex(h=>aliases.includes(h));
}

// التصدير: اسم الصنف، الكمية الفعلية، سعر الشراء.
async function exportExcel(){
  if(typeof XLSX==='undefined'){alert('مكتبة Excel غير جاهزة.');return;}
  if(!stock.length){alert('لا توجد أصناف لتصديرها.');return;}
  try{
    const rows=[['اسم الصنف','الكمية الفعلية','سعر الشراء']];
    stock.forEach(x=>{
      const actual=x.actualQty!==undefined && x.actualQty!==null && x.actualQty!==''?Number(x.actualQty):'';
      rows.push([x.name||'',actual,Number(x.price)||0]);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:30},{wch:18},{wch:18}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'الجرد الفعلي');
    const base64=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
    const fileName='جرد_الربيعي_ماركت.xlsx';
    if(window.NativeFiles && typeof window.NativeFiles.saveFile==='function'){
      const saved=await window.NativeFiles.saveFile(fileName,base64,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if(saved && saved.cancelled)return;
      alert('تم حفظ ملف Excel في مجلد Downloads داخل مجلد Al-Rubaie Market.');
      return;
    }
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=fileName;a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    alert('تم إنشاء ملف Excel.');
  }catch(error){
    if(error && error.name==='AbortError')return;
    alert('تعذر تصدير Excel: '+(error.message||error));
  }
}

// الاستيراد: اسم الصنف، الباركود، كمية النظام، سعر الشراء، سعر البيع.
function normalizeItemName(value){
  return String(value??'').normalize('NFKC')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[\u200e\u200f]/g,'')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function normalizeBarcode(value){
  return String(value??'').trim().replace(/\s+/g,'');
}
function importExcel(event){
  const file=event.target.files && event.target.files[0];
  if(!file)return;
  if(typeof XLSX==='undefined'){alert('مكتبة Excel غير جاهزة');event.target.value='';return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellText:true,cellDates:false});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
      if(!matrix.length){alert('ملف Excel فارغ');return;}
      const headers=matrix[0];
      const nameIndex=findHeaderIndex(headers,['اسمالصنف','الصنف','اسم','name','itemname']);
      const barcodeIndex=findHeaderIndex(headers,['رمزالباركود','الباركود','باركود','barcode','barcodeno']);
      const qtyIndex=findHeaderIndex(headers,['كميةالنظام','الكميهالنظام','الكميةالمسجلة','الكميهالمسجله','الكمية','الكميه','العدد','qty','quantity','systemqty']);
      const priceIndex=findHeaderIndex(headers,['سعرالشراء','سعرالشراءللوحدة','سعرشراء','price','purchaseprice']);
      const salePriceIndex=findHeaderIndex(headers,['سعرالبيع','سعرالبيعللوحدة','saleprice','sellingprice']);
      if(nameIndex<0||barcodeIndex<0||qtyIndex<0||priceIndex<0||salePriceIndex<0){
        alert('عناوين الأعمدة المطلوبة بالترتيب: اسم الصنف، رمز الباركود، كمية النظام، سعر الشراء، سعر البيع.');
        return;
      }
      let added=0,updated=0,skipped=0,barcodeConflicts=0;
      for(let i=1;i<matrix.length;i++){
        const row=matrix[i], name=String(row[nameIndex]??'').trim();
        const barcode=normalizeBarcode(row[barcodeIndex]);
        if(!name){skipped++;continue;}
        const qty=parseExcelNumber(row[qtyIndex]);
        const price=parseExcelNumber(row[priceIndex]);
        const salePrice=parseExcelNumber(row[salePriceIndex]);
        if(!Number.isFinite(qty)||qty<0||!Number.isFinite(price)||price<0||!Number.isFinite(salePrice)||salePrice<0){skipped++;continue;}
        const key=normalizeItemName(name);
        let existingIndex=-1;
        if(barcode) existingIndex=stock.findIndex(x=>normalizeBarcode(x.barcode)===barcode);
        if(existingIndex<0) existingIndex=stock.findIndex(x=>normalizeItemName(x.name)===key);
        if(existingIndex>=0){
          const otherBarcodeIndex=barcode?stock.findIndex((x,index)=>index!==existingIndex&&normalizeBarcode(x.barcode)===barcode):-1;
          if(otherBarcodeIndex>=0){barcodeConflicts++;skipped++;continue;}
          stock[existingIndex].qty=qty;
          stock[existingIndex].price=price;
          // لا نستبدل باركوداً موجوداً؛ نضيف باركود الملف فقط إذا كان الصنف بلا باركود.
          if(barcode&&!normalizeBarcode(stock[existingIndex].barcode)) stock[existingIndex].barcode=barcode;
          updated++;
        }else{
          const duplicateBarcode=barcode?stock.some(x=>normalizeBarcode(x.barcode)===barcode):false;
          if(duplicateBarcode){barcodeConflicts++;skipped++;continue;}
          stock.push({barcode,name,qty,price,salePrice});
          added++;
        }
      }
      save();
      alert('اكتمل الاستيراد\nأصناف جديدة: '+added+'\nأصناف تم تحديث كمية النظام وسعر الشراء لها: '+updated+'\nصفوف متجاهلة: '+skipped+'\nتعارضات باركود: '+barcodeConflicts);
    }catch(error){alert('تعذر قراءة الملف: '+(error.message||error));}
    finally{event.target.value='';}
  };
  reader.onerror=function(){alert('تعذرت قراءة ملف Excel.');event.target.value='';};
  reader.readAsArrayBuffer(file);
}
async function backupData(){
  const json=JSON.stringify(stock,null,2);
  const base64=btoa(unescape(encodeURIComponent(json)));
  const stamp=new Date().toISOString().replace(/[:.]/g,'-');
  const fileName='نسخة_احتياطية_الربيعي_'+stamp+'.json';
  try{
    if(window.NativeFiles && typeof window.NativeFiles.saveFile==='function'){
      const saved=await window.NativeFiles.saveFile(fileName,base64,'application/json');
      if(saved && saved.cancelled)return;
      alert('تم حفظ النسخة الاحتياطية في مجلد Downloads داخل مجلد Al-Rubaie Market. يمكنك العثور عليها من تطبيق «ملفاتي».');
      return;
    }
  }catch(error){if(error && error.name==='AbortError')return;alert('تعذر حفظ النسخة الاحتياطية: '+(error.message||error));return;}
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fileName;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function restoreBackup(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)||!data.every(x=>x&&typeof x.name==='string')){alert('ملف النسخة الاحتياطية غير صالح');return;}
      if(confirm('سيتم استبدال بيانات المخزون الحالية. هل تريد المتابعة؟')){
        stock=data.map(x=>({...x,name:x.name,barcode:String(x.barcode||''),qty:Number(x.qty)||0,price:Number(x.price)||0}));
        save();selectedCountIndex=-1;renderCountSelection();alert('تمت استعادة البيانات بنجاح');
      }
    }catch(error){alert('تعذر استعادة النسخة الاحتياطية');}
    finally{event.target.value='';}
  };
  reader.readAsText(file);
}
showItems();
updateSavedTime();
renderCountSelection();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(error=>console.error('SW error:',error)));
}
</script>
<script src="./scanner.js"></script>
</body>
  </html>
