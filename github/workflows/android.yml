
name: Build Al-Rubaie Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Add Camera Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = '    <uses-permission android:name="android.permission.CAMERA" />'

          if permission not in content:
              content = content.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          path.write_text(content)
          print("Camera permission added successfully")
          PY
          
      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-rubaie-inventory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
