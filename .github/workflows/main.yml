
name: Build Al-Rubaie Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web files
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Google Barcode Scanner
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          metadata = '<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />'

          if metadata not in content:
              content, count = re.subn(
                  r'(<application\b[^>]*>)',
                  r'\1\n        ' + metadata,
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not find application tag")

          path.write_text(content)
          print("Google Barcode Scanner configured successfully")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-rubaie-inventory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
